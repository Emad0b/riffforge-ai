name: RiffForge verification
on: [push, pull_request]
jobs:
  audio-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt && pip install --no-deps basic-pitch==0.4.0
      - run: python -m pytest -q
      - run: python -m riffforge.evaluate
      - uses: actions/upload-artifact@v4
        with: {name: measured-reference-evaluation, path: docs/evaluation.json}
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: pip install -r requirements.txt && pip install --no-deps basic-pitch==0.4.0
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: |
          mkdir -p runtime
          python -m uvicorn riffforge.api:app --host 127.0.0.1 --port 8400 > runtime/api.log 2>&1 &
          python -m riffforge.worker > runtime/worker.log 2>&1 &
          cd apps/web && npm start > ../../runtime/web.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5178 > /dev/null && break; sleep 1; done
      - run: npm test
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-evidence, path: 'docs/*.png'}
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: browser-debug, path: runtime/*.log}
  docker-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - run: python tests/docker_smoke.py
      - run: curl -fsS http://127.0.0.1:5178 > /dev/null
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down -v
        if: always()
